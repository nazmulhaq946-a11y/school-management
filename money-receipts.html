<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>মানি রিসিট · School</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --mr-primary: #7c3aed;
      --mr-primary-dark: #6d28d9;
      --mr-emerald: #10b981;
      --mr-emerald-dark: #059669;
      --mr-rose: #f43f5e;
      --mr-orange: #f59e0b;
      --mr-blue: #3b82f6;
      --mr-cyan: #06b6d4;
    }

    .mr-header {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 50%, #5b21b6 100%);
      padding: 24px 28px;
      display: flex; justify-content: space-between; align-items: center;
      color: white;
      border-radius: 10px 10px 0 0;
      position: relative;
      overflow: hidden;
      flex-wrap: wrap;
      gap: 12px;
    }
    .mr-header::before {
      content: '';
      position: absolute;
      top: -50%; right: -10%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    .mr-header > * { position: relative; z-index: 1; }
    .mr-header .left { display: flex; align-items: center; gap: 16px; }
    .mr-header .icon-box {
      width: 56px; height: 56px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
    .mr-header h1 {
      font-size: 22px; font-weight: 900;
      margin: 0; letter-spacing: -0.3px;
    }
    .mr-header p {
      font-size: 13px; margin: 4px 0 0 0;
      opacity: 0.9; font-weight: 500;
    }
    .mr-back {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      padding: 10px 18px; border-radius: 10px; cursor: pointer;
      font-weight: 700; font-size: 13.5px;
      display: flex; align-items: center; gap: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .mr-back:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }
    .mr-back .arrow {
      background: white; color: #5b21b6;
      border-radius: 50%;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 900;
    }

    .mr-body {
      background: white;
      padding: 24px 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 16px;
      border-radius: 0 0 10px 10px;
    }

    .mr-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .mr-stat {
      background: white;
      border-radius: 14px;
      padding: 16px 18px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .mr-stat::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--sc, #7c3aed), transparent);
    }
    .mr-stat:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
    }
    .mr-stat .icon {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: var(--sbg, #ede9fe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .mr-stat .info { min-width: 0; }
    .mr-stat .info h4 {
      font-size: 10.5px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .mr-stat .info p {
      font-size: 20px;
      font-weight: 900;
      color: #1e1b4b;
      line-height: 1;
      letter-spacing: -0.5px;
    }
    .mr-stat.purple { --sc:#7c3aed; --sbg:#ede9fe; }
    .mr-stat.green  { --sc:#10b981; --sbg:#d1fae5; }
    .mr-stat.orange { --sc:#f59e0b; --sbg:#fef3c7; }
    .mr-stat.blue   { --sc:#3b82f6; --sbg:#dbeafe; }
    .mr-stat.green .info p  { color: #10b981; }
    .mr-stat.orange .info p { color: #f59e0b; }
    .mr-stat.blue .info p   { color: #3b82f6; }

    .mr-filters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr auto auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 20px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }
    .mr-filters .fld {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }
    .mr-filters label {
      font-size: 11px;
      color: #64748b;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding-left: 2px;
    }
    .mr-filters input,
    .mr-filters select {
      padding: 10px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 13.5px;
      font-family: inherit;
      font-weight: 600;
      background: white;
      color: #1e293b;
      transition: all 0.2s;
      width: 100%;
    }
    .mr-filters input:focus,
    .mr-filters select:focus {
      outline: none;
      border-color: #7c3aed;
      box-shadow: 0 0 0 4px rgba(124,58,237,0.1);
    }

    .mr-btn {
      padding: 11px 18px;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
      height: 42px;
    }
    .mr-btn-search {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: white;
      box-shadow: 0 4px 12px rgba(124,58,237,0.3);
    }
    .mr-btn-search:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(124,58,237,0.4); }
    .mr-btn-reset {
      background: #e5e7eb;
      color: #374151;
    }
    .mr-btn-reset:hover { background: #d1d5db; }

    .mr-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .mr-toolbar .count {
      font-size: 13.5px;
      font-weight: 700;
      color: #4b5563;
    }
    .mr-toolbar .count b {
      color: #7c3aed;
      font-size: 16px;
      background: #ede9fe;
      padding: 2px 10px;
      border-radius: 10px;
      margin: 0 4px;
    }
    .mr-toolbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mr-btn-excel {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 12px rgba(16,185,129,0.3);
    }
    .mr-btn-excel:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(16,185,129,0.4); }
    .mr-btn-print-all {
      background: #f3f4f6;
      color: #374151;
      border: 2px solid #e5e7eb;
    }
    .mr-btn-print-all:hover { background: #e5e7eb; }

    .mr-table-wrap {
      overflow-x: auto;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: white;
    }
    .mr-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 1000px;
    }
    .mr-table thead th {
      background: linear-gradient(180deg, #f8fafc, #f1f5f9);
      color: #1e293b;
      padding: 13px 14px;
      text-align: left;
      font-weight: 800;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #e2e8f0;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .mr-table thead th.right { text-align: right; }
    .mr-table thead th.center { text-align: center; }

    .mr-table tbody tr {
      border-bottom: 1px solid #f3f4f6;
      transition: background 0.1s;
      cursor: pointer;
    }
    .mr-table tbody tr:last-child { border-bottom: none; }
    .mr-table tbody tr:hover { background: #faf5ff; }
    .mr-table tbody tr:nth-child(even) { background: #fafbfc; }
    .mr-table tbody tr:nth-child(even):hover { background: #faf5ff; }

    .mr-table tbody td {
      padding: 12px 14px;
      vertical-align: middle;
      color: #1f2937;
    }
    .mr-table tbody td.right { text-align: right; }
    .mr-table tbody td.center { text-align: center; }

    .mr-table td.receipt-cell {
      font-family: 'Courier New', monospace;
      font-weight: 800;
      color: #6d28d9;
      font-size: 12.5px;
    }
    .mr-table td.date-cell {
      color: #4b5563;
      font-weight: 600;
      font-size: 12.5px;
    }
    .mr-table td.date-cell small {
      display: block;
      color: #9ca3af;
      font-size: 10.5px;
      font-weight: 600;
      margin-top: 2px;
    }
    .mr-table td.student-cell {
      font-weight: 700;
      color: #1f2937;
    }
    .mr-table td.student-cell small {
      display: block;
      color: #6b7280;
      font-weight: 600;
      font-size: 11px;
      margin-top: 2px;
      font-family: 'Courier New', monospace;
    }
    .mr-table td.class-cell {
      font-weight: 600;
      color: #374151;
      font-size: 12.5px;
    }
    .mr-table td.amount-cell {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 14px;
      color: #059669;
      text-align: right;
    }
    .mr-table td.paid-cell {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 14px;
      color: #6d28d9;
      text-align: right;
    }
    .mr-table td.method-cell {
      text-align: center;
    }
    .method-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      background: #f3f4f6;
      color: #4b5563;
    }
    .method-badge.cash  { background: #d1fae5; color: #065f46; }
    .method-badge.bkash { background: #fce7f3; color: #9d174d; }
    .method-badge.nagad { background: #fef3c7; color: #92400e; }
    .method-badge.bank  { background: #dbeafe; color: #1e40af; }
    .method-badge.cheque{ background: #ede9fe; color: #5b21b6; }

    .mr-table .view-icon {
      color: #9ca3af;
      font-size: 16px;
      transition: color 0.15s;
    }
    .mr-table tbody tr:hover .view-icon { color: #7c3aed; }

    .mr-empty {
      padding: 60px 20px;
      text-align: center;
      color: #9ca3af;
      font-weight: 600;
      font-size: 14px;
    }
    .mr-empty .icon { font-size: 64px; display: block; margin-bottom: 14px; opacity: 0.4; }
    .mr-empty h3 { color: #374151; font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .mr-loading {
      padding: 60px 20px;
      text-align: center;
      color: #7c3aed;
      font-weight: 700;
    }
    .mr-loading::before {
      content: '';
      display: inline-block;
      width: 20px; height: 20px;
      border: 3px solid #ede9fe;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ PRINT HEADER (only visible in print) ============ */
    .print-header {
      display: none;
      text-align: center;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 3px double #1e1b4b;
    }
    .print-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #1e1b4b;
      margin: 0 0 4px 0;
      letter-spacing: 0.3px;
      font-family: 'Arial Black', 'Noto Sans Bengali', sans-serif;
      text-transform: uppercase;
    }
    .print-header .addr {
      font-size: 11.5px;
      color: #374151;
      margin: 0 0 2px 0;
    }
    .print-header .emis {
      font-size: 10.5px;
      color: #6b7280;
      margin-bottom: 8px;
    }
    .print-header h2 {
      background: #ede9fe;
      color: #4c1d95;
      padding: 5px;
      margin: 8px auto 6px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      border-radius: 3px;
      display: inline-block;
      padding-left: 30px;
      padding-right: 30px;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
    }
    .print-header .filter-info {
      font-size: 10.5px;
      color: #374151;
      font-family: Arial, sans-serif;
    }

    .mr-table tfoot td {
      font-weight: 900;
      font-size: 13px;
      padding: 12px 14px;
      background: #ede9fe !important;
      color: #4c1d95;
      border-top: 2px solid #7c3aed;
    }
    .mr-table tfoot td.right {
      text-align: right;
      font-size: 14px;
    }

    /* ============ RECEIPT MODAL ============ */
    .rc-modal {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(15,23,42,0.75);
      backdrop-filter: blur(6px);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 20px; overflow-y: auto;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .rc-modal-inner {
      background: #e5e7eb; border-radius: 16px;
      width: 100%; max-width: 820px; padding: 20px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      animation: modalIn 0.3s ease;
      margin: auto;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .rc-actions-top {
      display: flex; gap: 12px; justify-content: center;
      margin-bottom: 20px; padding-bottom: 16px;
      border-bottom: 1px dashed #d1d5db;
      flex-wrap: wrap;
    }
    .rc-actions-top button {
      padding: 12px 24px; border-radius: 10px;
      font-weight: 800; font-size: 14px; cursor: pointer; border: none;
      display: inline-flex; align-items: center; gap: 8px;
      transition: all 0.15s;
      font-family: inherit;
    }
    .rc-btn-print { background: #10b981; color: white; }
    .rc-btn-print:hover { background: #059669; transform: translateY(-1px); }
    .rc-btn-close { background: #64748b; color: white; }
    .rc-btn-close:hover { background: #475569; }

    .receipt-copy {
      background: white; padding: 18px 22px 16px;
      color: #000;
      font-family: 'Times New Roman', 'Noto Sans Bengali', serif;
      border: 2px solid #1e1b4b; border-radius: 6px;
      position: relative;
      page-break-inside: avoid;
    }
    .receipt-copy + .receipt-copy { border-top: none; border-radius: 0 0 6px 6px; }
    .receipt-copy:first-child { border-radius: 6px 6px 0 0; }
    .cut-line {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 0; font-size: 11px; color: #9ca3af;
      font-style: italic; font-family: 'Arial', sans-serif;
    }
    .cut-line::before, .cut-line::after {
      content: ''; flex: 1; border-top: 1.5px dashed #9ca3af;
    }
    .cut-line span { padding: 0 6px; white-space: nowrap; }
    .copy-badge {
      position: absolute; top: 8px; right: 10px;
      padding: 3px 12px; border-radius: 4px;
      font-family: 'Arial', sans-serif;
      font-size: 10.5px; font-weight: 800;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .copy-badge.student { background: #d1fae5; color: #065f46; border: 1px solid #16a34a; }
    .copy-badge.office  { background: #fef3c7; color: #78350f; border: 1px solid #f59e0b; }

    .rc-head {
      text-align: center; border-bottom: 2px double #1e1b4b;
      padding-bottom: 6px; margin-bottom: 8px;
    }
    .rc-head h1 {
      font-size: 18px; font-weight: 800; color: #1e1b4b;
      margin: 0; letter-spacing: 0.4px; text-transform: uppercase;
    }
    .rc-head p {
      font-size: 10.5px; color: #374151; margin: 2px 0 0 0;
    }
    .rc-title {
      background: #d1fae5; text-align: center; padding: 4px;
      font-weight: 800; letter-spacing: 2px; color: #065f46;
      margin-bottom: 8px; border-radius: 3px; font-size: 12px;
      font-family: 'Arial', sans-serif;
    }
    .rc-info {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 3px 20px; font-size: 11px; margin-bottom: 8px;
    }
    .rc-info .row {
      display: flex; justify-content: space-between;
      padding: 2px 0; border-bottom: 1px dotted #9ca3af;
    }
    .rc-info .row .lbl { font-weight: 700; color: #374151; }
    .rc-info .row .val { font-weight: 700; color: #000; }
    .rc-table {
      width: 100%; border-collapse: collapse;
      font-size: 11px; margin-top: 6px;
    }
    .rc-table th, .rc-table td {
      border: 1px solid #000; padding: 4px 8px; text-align: left;
    }
    .rc-table th {
      background: #f3f4f6; font-weight: 700; font-size: 10.5px;
    }
    .rc-table td.money { text-align: right; font-weight: 700; }
    .rc-table tr.total-row td {
      background: #d1fae5; font-weight: 800; font-size: 12px;
    }
    .rc-words {
      margin-top: 8px; font-size: 11px; font-style: italic;
      color: #374151; padding: 5px 8px; background: #f9fafb;
      border-left: 3px solid #16a34a; border-radius: 3px;
    }
    .rc-words b { font-style: normal; color: #000; }
    .rc-signs {
      display: flex; justify-content: space-between;
      margin-top: 30px; font-size: 10.5px;
      font-weight: 700; font-family: 'Arial', sans-serif;
    }
    .rc-signs > div {
      border-top: 1px solid #000; padding-top: 3px;
      min-width: 130px; text-align: center;
    }
    .rc-footer-note {
      text-align: center; font-size: 9.5px; color: #6b7280;
      margin-top: 10px; font-style: italic;
    }

    /* ============================================================
       PRINT STYLES
       ============================================================ */
    @media print {
      @page { size: A4 landscape; margin: 10mm 8mm; }
      body {
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      /* Hide chrome in ALL print modes */
      header.top, aside.sidebar, #toast, .no-print,
      .mr-header, .rc-actions-top, .cut-line {
        display: none !important;
      }
      main.content { margin-left: 0 !important; padding: 0 !important; }

      /* ============================================================
         LIST PRINT MODE — table print করলে এই rules কাজ করবে
         ============================================================ */
      body.print-mode-list .mr-body {
        display: block !important;
        padding: 0 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
      }
      body.print-mode-list .mr-stats,
      body.print-mode-list .mr-filters,
      body.print-mode-list .mr-toolbar {
        display: none !important;
      }
      body.print-mode-list .print-header {
        display: block !important;
      }
      body.print-mode-list .mr-table-wrap {
        border: none !important;
        border-radius: 0 !important;
        overflow: visible !important;
      }
      body.print-mode-list .mr-table {
        min-width: 0 !important;
        font-size: 10px !important;
        width: 100% !important;
      }
      body.print-mode-list .mr-table thead th {
        background: #e5e7eb !important;
        color: #000 !important;
        border: 1px solid #000 !important;
        padding: 5px 6px !important;
        font-size: 9px !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        position: static !important;
      }
      body.print-mode-list .mr-table tbody td {
        border: 1px solid #000 !important;
        padding: 4px 6px !important;
        font-size: 10px !important;
      }
      body.print-mode-list .mr-table tbody tr:nth-child(even) {
        background: #f9fafb !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body.print-mode-list .mr-table .method-badge {
        background: white !important;
        border: 1px solid #000 !important;
        color: #000 !important;
      }
      body.print-mode-list .mr-table tfoot td {
        background: #ede9fe !important;
        border: 1px solid #000 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body.print-mode-list .view-icon {
        display: none !important;
      }
      /* Hide receipt modal in list mode */
      body.print-mode-list .rc-modal {
        display: none !important;
      }

      /* ============================================================
         RECEIPT PRINT MODE — একটা receipt print করলে
         ============================================================ */
      body:not(.print-mode-list) .mr-body {
        display: none !important;
      }
      body:not(.print-mode-list) .rc-modal {
        position: static;
        background: white;
        padding: 0;
        display: block;
        backdrop-filter: none;
      }
      body:not(.print-mode-list) .rc-modal-inner {
        max-width: 100%;
        padding: 0;
        box-shadow: none;
        border-radius: 0;
        background: white;
        margin: 0;
      }
      body:not(.print-mode-list) .receipt-copy {
        border: 1.5px solid #1e1b4b !important;
        border-radius: 6px !important;
        margin: 0 0 10px 0 !important;
      }
      body:not(.print-mode-list) .receipt-copy + .receipt-copy {
        margin-top: 10px !important;
        border-top: 1.5px solid #1e1b4b !important;
        border-radius: 6px !important;
      }
      body:not(.print-mode-list) .rc-title {
        background: #d1fae5 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body:not(.print-mode-list) .rc-table th {
        background: #f3f4f6 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body:not(.print-mode-list) .rc-table tr.total-row td {
        background: #d1fae5 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body:not(.print-mode-list) .copy-badge.student {
        background: #d1fae5 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body:not(.print-mode-list) .copy-badge.office {
        background: #fef3c7 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body:not(.print-mode-list) .rc-words {
        background: #f9fafb !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }

    @media (max-width: 1000px) {
      .mr-filters { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 768px) {
      .mr-header { padding: 18px; }
      .mr-header h1 { font-size: 17px; }
      .mr-header .icon-box { width: 46px; height: 46px; font-size: 22px; }
      .mr-body { padding: 16px; }
      .mr-stats { grid-template-columns: 1fr 1fr; gap: 10px; }
      .mr-stat { padding: 12px 14px; }
      .mr-stat .icon { width: 38px; height: 38px; font-size: 18px; }
      .mr-stat .info p { font-size: 16px; }
      .mr-filters { grid-template-columns: 1fr; gap: 10px; padding: 12px; }
      .mr-btn { width: 100%; }
      .mr-toolbar { flex-direction: column; align-items: stretch; }
      .mr-toolbar-actions { justify-content: center; }
      .mr-table { font-size: 12px; min-width: 800px; }
      .mr-table thead th, .mr-table tbody td { padding: 9px 10px; }
      .rc-modal-inner { padding: 12px; }
      .receipt-copy { padding: 12px 14px 10px; }
      .rc-head h1 { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { supabase } from './js/supabase.js';
    import { requireLogin, renderLayout, esc, toast, getSchoolProfile } from './js/helpers.js';

    const profile = await requireLogin(['admin','teacher','guardian','student']);
    if (!profile) throw new Error('no auth');
    renderLayout(profile, 'money-receipts.html', 'মানি রিসিট');

    const content = document.getElementById('content');
    const isStaff = profile.role === 'admin' || profile.role === 'teacher';
    const school = await getSchoolProfile();

    let allReceipts = [];
    let filteredReceipts = [];
    let allClasses = [];

    const todayStr = new Date().toISOString().slice(0, 10);
    const monthStartStr = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0, 10);

    content.innerHTML = `
      <div class="mr-header">
        <div class="left">
          <div class="icon-box">🧾</div>
          <div>
            <h1>মানি রিসিট</h1>
            <p>Money Receipts · সব ফি পেমেন্টের রেকর্ড</p>
          </div>
        </div>
        <a class="mr-back" href="dashboard.html">
          Back <span class="arrow">←</span>
        </a>
      </div>

      <div class="mr-body">

        <div class="mr-stats" id="mrStats">
          <div class="mr-stat purple">
            <div class="icon">🧾</div>
            <div class="info">
              <h4>মোট রিসিট</h4>
              <p id="stTotal">0</p>
            </div>
          </div>
          <div class="mr-stat green">
            <div class="icon">💵</div>
            <div class="info">
              <h4>মোট আদায়</h4>
              <p id="stAmount">৳ 0</p>
            </div>
          </div>
          <div class="mr-stat orange">
            <div class="icon">📅</div>
            <div class="info">
              <h4>আজকের আদায়</h4>
              <p id="stToday">৳ 0</p>
            </div>
          </div>
          <div class="mr-stat blue">
            <div class="icon">📊</div>
            <div class="info">
              <h4>এই মাসে</h4>
              <p id="stMonth">৳ 0</p>
            </div>
          </div>
        </div>

        <div class="mr-filters">
          <div class="fld">
            <label>From Date</label>
            <input type="date" id="f_from" value="${monthStartStr}">
          </div>
          <div class="fld">
            <label>To Date</label>
            <input type="date" id="f_to" value="${todayStr}">
          </div>
          <div class="fld">
            <label>ক্লাস</label>
            <select id="f_class">
              <option value="">সব ক্লাস</option>
            </select>
          </div>
          <div class="fld">
            <label>Payment Method</label>
            <select id="f_method">
              <option value="">সব</option>
              <option value="cash">💵 Cash</option>
              <option value="bkash">📱 bKash</option>
              <option value="nagad">💳 Nagad</option>
              <option value="bank">🏦 Bank</option>
              <option value="cheque">📝 Cheque</option>
            </select>
          </div>
          <button class="mr-btn mr-btn-search" id="searchBtn">🔍 Search</button>
          <button class="mr-btn mr-btn-reset" id="resetBtn">🔄 Reset</button>
        </div>

        <div class="mr-toolbar">
          <div class="count">
            পাওয়া গেছে <b id="countNum">0</b> টি রিসিট
          </div>
          <div class="mr-toolbar-actions">
            <button class="mr-btn mr-btn-excel" id="excelBtn">📥 Excel Download</button>
            <button class="mr-btn mr-btn-print-all" id="printAllBtn">🖨️ Print List</button>
          </div>
        </div>

        <div id="tableArea">
          <div class="mr-loading">লোড হচ্ছে...</div>
        </div>
      </div>
    `;

    async function loadClasses() {
      try {
        const { data } = await supabase.from('classes').select('*').order('id');
        allClasses = data || [];
        document.getElementById('f_class').innerHTML =
          '<option value="">সব ক্লাস</option>' +
          allClasses.map(c => `<option value="${c.id}">${esc(c.class_name)}</option>`).join('');
      } catch (err) {
        console.error('Class load error:', err);
      }
    }
    await loadClasses();

    async function loadReceipts() {
      const tableArea = document.getElementById('tableArea');
      tableArea.innerHTML = '<div class="mr-loading">লোড হচ্ছে...</div>';

      const fromDate = document.getElementById('f_from').value;
      const toDate = document.getElementById('f_to').value;
      const classId = document.getElementById('f_class').value;
      const method = document.getElementById('f_method').value;

      let q = supabase.from('fee_payments').select('*')
        .order('payment_date', { ascending: false })
        .order('id', { ascending: false })
        .limit(2000);

      if (fromDate) q = q.gte('payment_date', fromDate);
      if (toDate) q = q.lte('payment_date', toDate);
      if (classId) q = q.eq('class_id', classId);
      if (method) q = q.eq('payment_method', method);

      if (!isStaff && profile.linked_id) {
        q = q.eq('student_index', profile.linked_id);
      }

      const { data, error } = await q;

      if (error) {
        console.error(error);
        tableArea.innerHTML = `
          <div class="mr-empty">
            <span class="icon">❌</span>
            <h3>লোড করা যায়নি</h3>
            <p>${esc(error.message)}</p>
          </div>
        `;
        return;
      }

      allReceipts = data || [];
      filteredReceipts = [...allReceipts];

      renderStats();
      renderTable();
    }

    function renderStats() {
      const totalCount = allReceipts.length;
      const totalAmount = allReceipts.reduce((s, r) => s + (+r.paid_amount || 0), 0);

      const todayAmount = allReceipts
        .filter(r => r.payment_date === todayStr)
        .reduce((s, r) => s + (+r.paid_amount || 0), 0);

      const monthAmount = allReceipts
        .filter(r => r.payment_date && r.payment_date >= monthStartStr)
        .reduce((s, r) => s + (+r.paid_amount || 0), 0);

      document.getElementById('stTotal').textContent = totalCount;
      document.getElementById('stAmount').textContent = '৳ ' + totalAmount.toLocaleString();
      document.getElementById('stToday').textContent = '৳ ' + todayAmount.toLocaleString();
      document.getElementById('stMonth').textContent = '৳ ' + monthAmount.toLocaleString();
      document.getElementById('countNum').textContent = totalCount;
    }

    function renderTable() {
      const tableArea = document.getElementById('tableArea');

      if (!filteredReceipts.length) {
        tableArea.innerHTML = `
          <div class="mr-empty">
            <span class="icon">📭</span>
            <h3>কোনো রিসিট পাওয়া যায়নি</h3>
            <p>তারিখ বা ফিল্টার পরিবর্তন করে আবার চেষ্টা করুন</p>
          </div>
        `;
        return;
      }

      // Total calculation
      const grandAmount = filteredReceipts.reduce((s, r) => s + (+r.amount || 0), 0);
      const grandPaid = filteredReceipts.reduce((s, r) => s + (+r.paid_amount || 0), 0);

      const fromDate = document.getElementById('f_from').value;
      const toDate = document.getElementById('f_to').value;
      const classId = document.getElementById('f_class').value;
      const method = document.getElementById('f_method').value;

      const classLabel = classId
        ? (allClasses.find(c => String(c.id) === String(classId))?.class_name || '')
        : '';
      const methodLabel = method ? method.toUpperCase() : '';

      tableArea.innerHTML = `
        <div class="mr-table-wrap">

          <!-- PRINT-ONLY HEADER -->
          <div class="print-header">
            <h1>${esc(school.name).toUpperCase()}</h1>
            <p class="addr">${esc(school.address)}</p>
            ${school.emis ? `<p class="emis">EMIS: ${esc(school.emis)}</p>` : ''}
            <h2>Money Receipts List</h2>
            <p class="filter-info">
              Date: ${esc(fromDate)} to ${esc(toDate)}
              ${classLabel ? ' · Class: ' + esc(classLabel) : ''}
              ${methodLabel ? ' · Method: ' + esc(methodLabel) : ''}
              · Total: ${filteredReceipts.length} receipts
            </p>
          </div>

          <table class="mr-table">
            <thead>
              <tr>
                <th style="width:130px">Receipt No.</th>
                <th style="width:120px">তারিখ</th>
                <th>ছাত্রের নাম</th>
                <th style="width:130px">ক্লাস</th>
                <th>Fee Type</th>
                <th style="width:110px" class="right">Amount</th>
                <th style="width:110px" class="right">Paid</th>
                <th style="width:90px" class="center">Method</th>
                <th style="width:50px" class="center no-print">👁️</th>
              </tr>
            </thead>
            <tbody>
              ${filteredReceipts.map(r => renderRow(r)).join('')}
            </tbody>
            <tfoot>
              <tr>
                <td colspan="5" style="text-align:right">সর্বমোট (${filteredReceipts.length} টি রিসিট) :</td>
                <td class="right">৳ ${grandAmount.toLocaleString()}</td>
                <td class="right">৳ ${grandPaid.toLocaleString()}</td>
                <td colspan="2"></td>
              </tr>
            </tfoot>
          </table>
        </div>
      `;

      tableArea.querySelectorAll('tbody tr').forEach(tr => {
        tr.onclick = () => {
          const id = tr.dataset.id;
          const receipt = filteredReceipts.find(x => String(x.id) === String(id));
          if (receipt) openReceiptModal(receipt);
        };
      });
    }

    function renderRow(r) {
      const dateObj = r.payment_date ? new Date(r.payment_date) : null;
      const dateStr = dateObj
        ? dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
        : '-';
      const dayStr = dateObj
        ? dateObj.toLocaleDateString('bn-BD', { weekday: 'short' })
        : '';

      const method = (r.payment_method || 'cash').toLowerCase();
      const methodLabel = {
        cash: '💵 Cash',
        bkash: '📱 bKash',
        nagad: '💳 Nagad',
        bank: '🏦 Bank',
        cheque: '📝 Cheque',
      }[method] || method;

      const paid = +r.paid_amount || 0;
      const amount = +r.amount || 0;

      return `
        <tr data-id="${r.id}">
          <td class="receipt-cell">${esc(r.receipt_no || '—')}</td>
          <td class="date-cell">
            ${dateStr}
            <small>${dayStr}</small>
          </td>
          <td class="student-cell">
            ${esc(r.student_name || '-')}
            <small>${esc(r.student_index || '')}</small>
          </td>
          <td class="class-cell">
            ${esc(r.class_name || '-')}${r.section ? ' · ' + esc(r.section) : ''}
          </td>
          <td>
            ${esc(r.fee_type_name || '-')}
            ${r.fee_month ? `<br><small style="color:#9ca3af;font-size:11px">${esc(r.fee_month)}</small>` : ''}
          </td>
          <td class="amount-cell">৳ ${amount.toLocaleString()}</td>
          <td class="paid-cell">৳ ${paid.toLocaleString()}</td>
          <td class="method-cell">
            <span class="method-badge ${method}">${methodLabel}</span>
          </td>
          <td class="center no-print">
            <span class="view-icon">→</span>
          </td>
        </tr>
      `;
    }

    document.getElementById('searchBtn').onclick = loadReceipts;
    document.getElementById('resetBtn').onclick = () => {
      document.getElementById('f_from').value = monthStartStr;
      document.getElementById('f_to').value = todayStr;
      document.getElementById('f_class').value = '';
      document.getElementById('f_method').value = '';
      loadReceipts();
    };

    ['f_from', 'f_to', 'f_class', 'f_method'].forEach(id => {
      document.getElementById(id).onchange = loadReceipts;
    });

    /* ============================================================
       PRINT LIST — Fixed!
       এখন body-তে class যোগ হবে যাতে শুধু table print হয়
       ============================================================ */
    document.getElementById('printAllBtn').onclick = () => {
      if (!filteredReceipts.length) {
        toast('কোনো রিসিট নেই', 'error');
        return;
      }

      // Add print mode class
      document.body.classList.add('print-mode-list');

      // Small delay for browser to apply styles
      setTimeout(() => {
        window.print();

        // Remove after print dialog closes
        setTimeout(() => {
          document.body.classList.remove('print-mode-list');
        }, 500);
      }, 50);
    };

    /* ============ Receipt Modal ============ */
    function openReceiptModal(r) {
      const receiptData = {
        ...r,
        amount: +r.amount || 0,
        discount: +r.discount || 0,
        paid_amount: +r.paid_amount || 0,
        items: [{
          name: r.fee_type_name || 'Fee',
          month: r.fee_month,
          amount: +r.amount || 0,
          discount: +r.discount || 0,
          paid: +r.paid_amount || 0,
        }],
      };

      const dateStr = new Date(r.payment_date).toLocaleDateString('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric',
      });

      const modalDiv = document.createElement('div');
      modalDiv.className = 'rc-modal';
      modalDiv.innerHTML = `
        <div class="rc-modal-inner">
          <div class="rc-actions-top no-print">
            <button class="rc-btn-print" id="rcPrint">🖨️ প্রিন্ট / PDF (২ কপি)</button>
            <button class="rc-btn-close" id="rcClose">✕ বন্ধ করুন</button>
          </div>
          <div class="receipt-copies">
            ${renderCopy('student', 'Student Copy', receiptData, dateStr)}
            <div class="cut-line no-print"><span>✂ কাটার লাইন / Cut Here</span></div>
            ${renderCopy('office', 'Office Copy', receiptData, dateStr)}
          </div>
        </div>
      `;
      document.body.appendChild(modalDiv);

      document.getElementById('rcClose').onclick = () => modalDiv.remove();
      document.getElementById('rcPrint').onclick = () => {
        document.body.classList.remove('print-mode-list');
        window.print();
      };
      modalDiv.onclick = (e) => {
        if (e.target === modalDiv) modalDiv.remove();
      };
    }

    function renderCopy(type, label, payment, dateStr) {
      const words = numberToWords(payment.paid_amount || 0);
      const items = payment.items || [];

      return `
        <div class="receipt-copy">
          <div class="copy-badge ${type}">${label}</div>
          <div class="rc-head">
            <h1>${esc(school.name).toUpperCase()}</h1>
            <p>${esc(school.address)}${school.emis ? ' · EMIS: ' + esc(school.emis) : ''}</p>
          </div>
          <div class="rc-title">MONEY RECEIPT</div>

          <div class="rc-info">
            <div class="row">
              <span class="lbl">Receipt No:</span>
              <span class="val">${esc(payment.receipt_no || '-')}</span>
            </div>
            <div class="row">
              <span class="lbl">Date:</span>
              <span class="val">${esc(dateStr)}</span>
            </div>
            <div class="row">
              <span class="lbl">Student ID:</span>
              <span class="val">${esc(payment.student_index || '-')}</span>
            </div>
            <div class="row">
              <span class="lbl">Student Name:</span>
              <span class="val">${esc(payment.student_name || '-')}</span>
            </div>
            <div class="row">
              <span class="lbl">Class:</span>
              <span class="val">${esc(payment.class_name || '-')}</span>
            </div>
            <div class="row">
              <span class="lbl">Section:</span>
              <span class="val">${esc(payment.section || '-')}</span>
            </div>
          </div>

          <table class="rc-table">
            <thead>
              <tr>
                <th style="width:28px">#</th>
                <th>Particulars</th>
                <th style="width:90px;text-align:right">Amount</th>
                <th style="width:90px;text-align:right">Paid</th>
              </tr>
            </thead>
            <tbody>
              ${items.map((it, i) => `
                <tr>
                  <td style="text-align:center">${i + 1}</td>
                  <td>${esc(it.name || '-')}${it.month ? ' — <b>' + esc(it.month) + '</b>' : ''}</td>
                  <td class="money">${it.amount || 0}</td>
                  <td class="money">${it.paid || 0}</td>
                </tr>
              `).join('')}
              <tr class="total-row">
                <td colspan="2">Total Paid (${(payment.payment_method || 'cash').toUpperCase()})</td>
                <td class="money">${payment.amount || 0}</td>
                <td class="money">৳ ${payment.paid_amount || 0}</td>
              </tr>
            </tbody>
          </table>

          <div class="rc-words"><b>In Words:</b> ${esc(words)}</div>

          <div class="rc-signs">
            <div>Collected By<br>${esc(payment.collected_by || '')}</div>
            <div>Guardian's Signature</div>
            <div>Authorized Signature</div>
          </div>

          <div class="rc-footer-note">This is a computer-generated receipt.</div>
        </div>
      `;
    }

    function numberToWords(num) {
      num = Math.floor(+num || 0);
      if (num === 0) return 'Zero Taka Only';
      const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
        'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
      const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

      function toWords(n) {
        if (n < 20) return ones[n];
        if (n < 100) return tens[Math.floor(n/10)] + (n % 10 ? ' ' + ones[n % 10] : '');
        if (n < 1000) return ones[Math.floor(n/100)] + ' Hundred' + (n % 100 ? ' ' + toWords(n % 100) : '');
        if (n < 100000) return toWords(Math.floor(n/1000)) + ' Thousand' + (n % 1000 ? ' ' + toWords(n % 1000) : '');
        if (n < 10000000) return toWords(Math.floor(n/100000)) + ' Lakh' + (n % 100000 ? ' ' + toWords(n % 100000) : '');
        return toWords(Math.floor(n/10000000)) + ' Crore' + (n % 10000000 ? ' ' + toWords(n % 10000000) : '');
      }
      return toWords(num) + ' Taka Only';
    }

    document.getElementById('excelBtn').onclick = () => {
      if (!filteredReceipts.length) {
        toast('কোনো রিসিট নেই', 'error');
        return;
      }

      const wb = XLSX.utils.book_new();

      const rows = [
        [school.name.toUpperCase()],
        [school.address],
        ['Money Receipts Report'],
        ['Generated:', new Date().toLocaleString('en-GB')],
        ['Filter:', `From ${document.getElementById('f_from').value} To ${document.getElementById('f_to').value}`],
        [],
        ['#', 'Receipt No', 'Date', 'Student ID', 'Student Name', 'Class', 'Section',
         'Fee Type', 'Fee Month', 'Amount', 'Discount', 'Paid', 'Method', 'Collected By'],
      ];

      let totalAmt = 0, totalPaid = 0;
      filteredReceipts.forEach((r, i) => {
        totalAmt += +r.amount || 0;
        totalPaid += +r.paid_amount || 0;
        rows.push([
          i + 1,
          r.receipt_no || '',
          r.payment_date || '',
          r.student_index || '',
          r.student_name || '',
          r.class_name || '',
          r.section || '',
          r.fee_type_name || '',
          r.fee_month || '',
          +r.amount || 0,
          +r.discount || 0,
          +r.paid_amount || 0,
          r.payment_method || 'cash',
          r.collected_by || '',
        ]);
      });

      rows.push([]);
      rows.push(['', '', '', '', '', '', '', '', 'TOTAL', totalAmt, '', totalPaid, '', '']);

      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [
        { wch: 5 }, { wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 22 },
        { wch: 12 }, { wch: 10 }, { wch: 18 }, { wch: 16 }, { wch: 12 },
        { wch: 10 }, { wch: 12 }, { wch: 10 }, { wch: 18 },
      ];
      XLSX.utils.book_append_sheet(wb, ws, 'Receipts');

      const now = new Date();
      const fileName = `Money_Receipts_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}.xlsx`;
      XLSX.writeFile(wb, fileName);

      toast('✅ Excel ডাউনলোড হয়েছে', 'success');
    };

    await loadReceipts();
  </script>
</body>
