<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ছাত্র রেজিস্ট্রেশন · School</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card" style="max-width:440px">
      <h1>🎓 ছাত্র রেজিস্ট্রেশন</h1>
      <p class="sub">নিজের অ্যাকাউন্ট খুলুন — পরে ফলাফল, হাজিরা, ফি দেখতে পারবেন</p>

      <label>পূর্ণ নাম *</label>
      <input id="fullName" placeholder="যেমন: রহিম উদ্দিন">

      <label>Student ID * (স্কুল থেকে পাওয়া)</label>
      <input id="studentId" placeholder="যেমন: STU-001" style="text-transform:uppercase">

      <label>ইমেইল *</label>
      <input id="email" type="email" placeholder="you@example.com">

      <label>পাসওয়ার্ড * (কমপক্ষে ৬ অক্ষর)</label>
      <input id="password" type="password" placeholder="••••••••">

      <label>পাসওয়ার্ড আবার *</label>
      <input id="password2" type="password" placeholder="••••••••">

      <button id="registerBtn">✅ রেজিস্ট্রেশন করুন</button>
      <p id="msg"></p>

      <p style="text-align:center;margin-top:20px;font-size:14px;color:#6b7280">
        আগে থেকেই অ্যাকাউন্ট আছে?
        <a href="index.html" style="color:#7c3aed;font-weight:600;text-decoration:none">লগইন করুন</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js';

    // আগে লগইন থাকলে সোজা ড্যাশবোর্ডে
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = 'dashboard.html';

    const btn = document.getElementById('registerBtn');
    const msg = document.getElementById('msg');

    btn.onclick = async () => {
      const fullName = document.getElementById('fullName').value.trim();
      const studentId = document.getElementById('studentId').value.trim().toUpperCase();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      // চেক
      if (!fullName || !studentId || !email || !password) {
        msg.textContent = 'সব ঘর পূরণ করুন';
        msg.style.color = 'red';
        return;
      }
      if (password.length < 6) {
        msg.textContent = 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে';
        msg.style.color = 'red';
        return;
      }
      if (password !== password2) {
        msg.textContent = 'দুইটা পাসওয়ার্ড মিলছে না';
        msg.style.color = 'red';
        return;
      }

      msg.textContent = 'Student ID যাচাই করা হচ্ছে...';
      msg.style.color = '#7c3aed';
      btn.disabled = true;

      // Student ID আছে কিনা চেক
      const { data: exists, error: checkErr } = await supabase
        .rpc('check_student_id', { sid: studentId });

      if (checkErr) {
        msg.textContent = '❌ ' + checkErr.message;
        msg.style.color = 'red';
        btn.disabled = false;
        return;
      }
      if (!exists) {
        msg.textContent = '❌ এই Student ID স্কুলে নেই। অ্যাডমিনের সাথে যোগাযোগ করুন।';
        msg.style.color = 'red';
        btn.disabled = false;
        return;
      }

      // ইতিমধ্যে কেউ এই ID দিয়ে অ্যাকাউন্ট খুলেছে কিনা
      const { data: alreadyLinked } = await supabase
        .rpc('is_student_id_linked', { sid: studentId });

      if (alreadyLinked) {
        msg.textContent = '❌ এই Student ID দিয়ে ইতিমধ্যে অ্যাকাউন্ট খোলা হয়েছে।';
        msg.style.color = 'red';
        btn.disabled = false;
        return;
      }

      msg.textContent = 'অ্যাকাউন্ট তৈরি হচ্ছে...';

      // Sign up
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName,
            linked_id: studentId
          }
        }
      });

      btn.disabled = false;

      if (error) {
        msg.textContent = '❌ ' + error.message;
        msg.style.color = 'red';
        return;
      }

      // Email confirm না থাকলে অটো লগইন হবে
      if (data.session) {
        msg.textContent = '✅ সফল! ড্যাশবোর্ডে যাচ্ছে...';
        msg.style.color = 'green';
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } else {
        msg.innerHTML = '✅ অ্যাকাউন্ট তৈরি হয়েছে!<br><small>ইমেইল যাচাই করুন, তারপর লগইন করুন।</small>';
        msg.style.color = 'green';
      }
    };

    // Enter চাপলেও কাজ করবে
    document.getElementById('password2').addEventListener('keydown', e => {
      if (e.key === 'Enter') btn.click();
    });
  </script>
</body>
</html>
