<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Credentials · School</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .sc-header {
      background: linear-gradient(135deg, #0891b2 0%, #0e7490 50%, #155e75 100%);
      padding: 22px 28px;
      display: flex; justify-content: space-between; align-items: center;
      color: white;
      border-radius: 10px 10px 0 0;
      flex-wrap: wrap; gap: 12px;
    }
    .sc-header .left { display: flex; align-items: center; gap: 16px; }
    .sc-header .icon-box {
      width: 56px; height: 56px;
      background: rgba(255,255,255,0.2);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
    .sc-header h1 { font-size: 22px; font-weight: 900; margin: 0; }
    .sc-header p { font-size: 13px; margin: 4px 0 0 0; opacity: 0.9; }
    .sc-back {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      padding: 10px 18px; border-radius: 10px;
      font-weight: 700; font-size: 13.5px;
      text-decoration: none;
    }
    .sc-body {
      background: white; padding: 24px 28px;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .sc-info-banner {
      background: #ecfeff;
      border-left: 4px solid #0891b2;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 13px;
      color: #155e75;
      line-height: 1.6;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .sc-info-banner .ico { font-size: 20px; flex-shrink: 0; }
    .sc-filters {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 20px;
      padding: 14px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .sc-filters .fld { display: flex; flex-direction: column; gap: 5px; }
    .sc-filters label {
      font-size: 11px; color: #64748b;
      font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .sc-filters select {
      padding: 10px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px; font-family: inherit;
      font-weight: 600; background: white;
    }
    .sc-btn {
      padding: 11px 20px;
      border: none; border-radius: 10px;
      font-weight: 800; font-size: 13.5px;
      cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; gap: 6px;
      height: 42px;
      transition: all 0.2s;
    }
    .sc-btn-primary {
      background: linear-gradient(135deg, #0891b2, #0e7490);
      color: white;
      box-shadow: 0 6px 16px rgba(8,145,178,0.3);
    }
    .sc-btn-print {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 6px 16px rgba(16,185,129,0.3);
    }
    .sc-summary {
      display: flex; gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .sc-summary-item {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12.5px; font-weight: 800;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .sc-summary-item.total { background: #ecfeff; color: #155e75; }
    .sc-summary-item.done { background: #d1fae5; color: #065f46; }
    .sc-summary-item.miss { background: #fef3c7; color: #92400e; }
    .sc-table {
      width: 100%; border-collapse: collapse;
      font-size: 13.5px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
    }
    .sc-table thead th {
      background: #f8fafc;
      padding: 12px 14px;
      text-align: left;
      font-weight: 800; font-size: 11.5px;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #e2e8f0;
    }
    .sc-table tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid #f3f4f6;
    }
    .sc-table tbody tr:nth-child(even) { background: #fafbfc; }
    .sc-table tbody tr:hover { background: #ecfeff; }
    .sc-table td.mono {
      font-family: 'Courier New', monospace;
      font-weight: 800; font-size: 13px;
    }
    .sc-table td.index-cell { color: #0891b2; }
    .sc-table td.pass-cell { color: #10b981; letter-spacing: 1.5px; }
    .sc-table td.name-cell { font-weight: 700; color: #1f2937; }
    .sc-table td.class-cell { font-weight: 600; color: #4b5563; }
    .sc-btn-sm {
      padding: 6px 12px;
      font-size: 11.5px;
      border: none; border-radius: 6px;
      font-weight: 800; cursor: pointer;
      font-family: inherit;
      display: inline-flex; align-items: center; gap: 4px;
      transition: all 0.15s;
    }
    .sc-reset { background: #fef3c7; color: #92400e; }
    .sc-print-one { background: #dbeafe; color: #1e40af; }
    .sc-empty {
      text-align: center;
      padding: 60px 20px;
      color: #9ca3af;
      font-weight: 600;
    }
    .sc-empty .icon { font-size: 64px; display: block; margin-bottom: 14px; opacity: 0.4; }
    .sc-loading {
      text-align: center;
      padding: 60px 20px;
      color: #0891b2;
      font-weight: 700;
    }
    .sc-loading::before {
      content: '';
      display: inline-block;
      width: 20px; height: 20px;
      border: 3px solid #cffafe;
      border-top-color: #0891b2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media print {
      @page { size: A4; margin: 12mm; }
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea {
        position: absolute;
        left: 0; top: 0;
        width: 100%;
      }
      .no-print, .sc-header, .sc-filters, .sc-summary, .sc-info-banner { display: none !important; }
      .sc-table {
        border: 1px solid #000 !important;
        font-size: 11px;
        border-radius: 0;
      }
      .sc-table thead th,
      .sc-table tbody td {
        border: 1px solid #000 !important;
        padding: 5px 8px !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .sc-table thead th {
        background: #e5e7eb !important;
        color: #000 !important;
      }
      .sc-table tbody tr:nth-child(even) { background: #f9fafb !important; }
      .sc-btn-sm { display: none !important; }
      .print-head { display: block !important; }
    }
    .print-head {
      display: none;
      text-align: center;
      margin-bottom: 16px;
      border-bottom: 3px double #1e1b4b;
      padding-bottom: 12px;
    }
    .print-head h1 {
      font-size: 20px; font-weight: 800;
      color: #1e1b4b; margin-bottom: 4px;
      text-transform: uppercase;
    }
    .print-head p { font-size: 12px; color: #6b7280; margin-bottom: 2px; }
    .print-head h2 {
      margin-top: 8px;
      font-size: 14px; color: #4c1d95;
      font-weight: 800; letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    @media (max-width: 768px) {
      .sc-header { padding: 18px; }
      .sc-header h1 { font-size: 17px; }
      .sc-header .icon-box { width: 46px; height: 46px; font-size: 22px; }
      .sc-body { padding: 16px; }
      .sc-filters { grid-template-columns: 1fr; }
      .sc-table { font-size: 12px; min-width: 600px; }
      .sc-table thead th, .sc-table tbody td { padding: 9px 10px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { supabase } from './js/supabase.js';
    import { requireLogin, renderLayout, esc, toast, getSchoolProfile } from './js/helpers.js';

    const profile = await requireLogin(['admin']);
    if (!profile) throw new Error('no auth');
    renderLayout(profile, 'student-credentials.html', 'Student Credentials');

    const content = document.getElementById('content');
    const school = await getSchoolProfile();

    let allStudents = [];
    let allClasses = [];

    const FIXED_STUDENT_PASSWORD = 'knsstudent';

    function generatePassword() {
      return FIXED_STUDENT_PASSWORD;
    }

    content.innerHTML = `
      <div class="sc-header">
        <div class="left">
          <div class="icon-box">🔑</div>
          <div>
            <h1>Student Login Credentials</h1>
            <p>সব ছাত্রের Index ও Password</p>
          </div>
        </div>
        <a class="sc-back" href="dashboard.html">← Back</a>
      </div>

      <div class="sc-body">
        <div class="sc-info-banner">
          <span class="ico">💡</span>
          <span>
            সব ছাত্রের <b>Password একই: <code style="background:white;padding:2px 8px;border-radius:4px;font-family:monospace;color:#10b981;font-weight:800">knsstudent</code></b>
            — শুধু <b>Index আলাদা</b>।
          </span>
        </div>

        <div class="sc-filters no-print">
          <div class="fld">
            <label>ক্লাস</label>
            <select id="f_class"><option value="">সব ক্লাস</option></select>
          </div>
          <div class="fld">
            <label>সেকশন</label>
            <select id="f_section"><option value="">সব সেকশন</option></select>
          </div>
          <button class="sc-btn sc-btn-primary" id="loadBtn">🔍 লোড করুন</button>
          <button class="sc-btn sc-btn-print" id="printBtn">🖨️ Print All</button>
        </div>

        <div id="tableArea">
          <div class="sc-empty">
            <span class="icon">🔑</span>
            <h3 style="color:#374151;margin-bottom:8px">ক্লাস সিলেক্ট করুন</h3>
            <p>উপরে ক্লাস বেছে নিয়ে "লোড করুন" ক্লিক করুন</p>
          </div>
        </div>
      </div>
    `;

    async function loadClasses() {
      const { data } = await supabase.from('classes').select('*').order('id');
      allClasses = data || [];
      document.getElementById('f_class').innerHTML =
        '<option value="">সব ক্লাস</option>' +
        allClasses.map(c => `<option value="${c.id}">${esc(c.class_name)}</option>`).join('');
    }
    await loadClasses();

    document.getElementById('f_class').onchange = () => {
      const cls = allClasses.find(c => String(c.id) === document.getElementById('f_class').value);
      const sections = cls?.sections || [];
      document.getElementById('f_section').innerHTML =
        '<option value="">সব সেকশন</option>' +
        sections.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    };

    async function loadStudents() {
      const classId = document.getElementById('f_class').value;
      const section = document.getElementById('f_section').value;
      const area = document.getElementById('tableArea');

      area.innerHTML = '<div class="sc-loading">লোড হচ্ছে...</div>';

      let q = supabase.from('students').select('*')
        .or('is_deleted.is.null,is_deleted.eq.false')
        .order('class_id').order('roll');

      if (classId) q = q.eq('class_id', classId);
      if (section) q = q.eq('section', section);

      const { data, error } = await q;

      if (error) {
        area.innerHTML = `<div class="sc-empty">❌ ${esc(error.message)}</div>`;
        return;
      }

      allStudents = data || [];

      if (!allStudents.length) {
        area.innerHTML = '<div class="sc-empty"><span class="icon">📭</span>কোনো ছাত্র পাওয়া যায়নি</div>';
        return;
      }

      renderTable();
    }

    function renderTable() {
      const area = document.getElementById('tableArea');

      const missing = allStudents.filter(s => !s.login_password).length;
      const withLogin = allStudents.length - missing;

      area.innerHTML = `
        <div class="sc-summary no-print">
          <span class="sc-summary-item total">👥 মোট: ${allStudents.length} জন</span>
          <span class="sc-summary-item done">✅ Login আছে: ${withLogin} জন</span>
          ${missing > 0 ? `<span class="sc-summary-item miss">⚠️ Login নেই: ${missing} জন</span>` : ''}
        </div>

        <div id="printArea">
          <div class="print-head">
            <h1>${esc(school.name).toUpperCase()}</h1>
            <p>${esc(school.address)}</p>
            ${school.emis ? `<p>EMIS: ${esc(school.emis)}</p>` : ''}
            <h2>Student Login Credentials</h2>
            <p style="font-size:11px;margin-top:6px">Generated: ${new Date().toLocaleString('en-GB')}</p>
          </div>

          ${missing > 0 ? `
            <div style="background:#fef3c7;border-left:4px solid #f59e0b;padding:12px 16px;border-radius:8px;margin-bottom:14px;font-size:13px;color:#92400e" class="no-print">
              ⚠️ <b>${missing} জন ছাত্রের</b> এখনো login তৈরি হয়নি। <b>✨ Generate</b> ক্লিক করুন।
            </div>
          ` : ''}

          <table class="sc-table">
            <thead>
              <tr>
                <th style="width:50px">#</th>
                <th style="width:110px">Index</th>
                <th>নাম</th>
                <th style="width:120px">ক্লাস</th>
                <th style="width:130px">Password</th>
                <th style="width:150px" class="no-print">Action</th>
              </tr>
            </thead>
            <tbody>
              ${allStudents.map((s, i) => {
                const cls = allClasses.find(c => c.id == s.class_id)?.class_name || '-';
                const pwdDisplay = s.login_password
                  ? esc(s.login_password)
                  : '<span style="color:#dc2626">— নেই —</span>';

                return `
                  <tr>
                    <td>${i + 1}</td>
                    <td class="mono index-cell">${esc(s.student_index || '-')}</td>
                    <td class="name-cell">${esc(s.name)}</td>
                    <td class="class-cell">${esc(cls)}${s.section ? ' · ' + esc(s.section) : ''}</td>
                    <td class="mono pass-cell">${pwdDisplay}</td>
                    <td class="no-print" style="display:flex;gap:6px;flex-wrap:wrap">
                      <button class="sc-btn-sm ${s.login_password ? 'sc-reset' : 'sc-btn-primary'}"
                        data-act="gen"
                        data-id="${s.id}"
                        data-index="${esc(s.student_index || '')}"
                        data-name="${esc(s.name)}">
                        ${s.login_password ? '🔄 Reset' : '✨ Generate'}
                      </button>
                      ${s.login_password ? `
                        <button class="sc-btn-sm sc-print-one"
                          data-act="print"
                          data-id="${s.id}">
                          🖨️ Print
                        </button>
                      ` : ''}
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>

          <div style="margin-top:20px;padding:12px;background:#f9fafb;border-radius:8px;font-size:11.5px;color:#6b7280" class="no-print">
            💡 <b>ছাত্রদের জানান:</b> Website-এ <b>"ছাত্র লগইন"</b> tab-এ Index আর Password <b>knsstudent</b> দিয়ে login করুন।
          </div>
        </div>
      `;

      area.querySelectorAll('.sc-btn-sm').forEach(btn => {
        btn.onclick = () => {
          const act = btn.dataset.act;
          const id = btn.dataset.id;
          if (act === 'gen') {
            handleGenerate(id, btn.dataset.index, btn.dataset.name);
          } else if (act === 'print') {
            const s = allStudents.find(x => String(x.id) === String(id));
            if (s) printSingleCard(s);
          }
        };
      });
    }

    async function handleGenerate(id, index, name) {
      const st = allStudents.find(x => String(x.id) === String(id));
      const hasPwd = !!(st && st.login_password);
      const action = hasPwd ? 'রিসেট' : 'তৈরি';

      if (!confirm(`"${name}" (${index})-এর login ${action} করবেন?`)) return;

      const pwd = generatePassword();
      const email = `${index}@student.local`;

      const { error } = await supabase.from('students').update({
        login_email: email,
        login_password: pwd,
        login_enabled: true,
      }).eq('id', id);

      if (error) {
        toast('❌ ' + error.message, 'error');
        return;
      }

      if (st) {
        st.login_email = email;
        st.login_password = pwd;
      }

      renderTable();
      toast(`✅ "${name}" — Password: ${pwd}`, 'success');

      showCredPopup(name, index, pwd);
    }

    function showCredPopup(name, index, pwd) {
      const modal = document.createElement('div');
      modal.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.75);backdrop-filter:blur(6px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
      modal.innerHTML = `
        <div style="background:white;border-radius:20px;padding:28px;max-width:400px;width:100%;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,0.4)">
          <div style="font-size:54px;margin-bottom:10px">🔑</div>
          <h3 style="color:#10b981;font-size:20px;font-weight:900;margin-bottom:6px">Login তৈরি হয়েছে</h3>
          <p style="color:#6b7280;font-size:13px;margin-bottom:18px">ছাত্রকে এই তথ্য দিন</p>

          <div style="background:#ecfeff;border-radius:14px;padding:18px;text-align:left;border:2px dashed #0891b2">
            <div style="font-size:10.5px;color:#6b7280;font-weight:800;text-transform:uppercase;margin-bottom:2px">Name</div>
            <div style="font-size:15px;font-weight:900;color:#1e1b4b;margin-bottom:10px">${esc(name)}</div>

            <div style="font-size:10.5px;color:#6b7280;font-weight:800;text-transform:uppercase;margin-bottom:2px">Index</div>
            <div style="font-size:20px;font-weight:900;color:#0891b2;font-family:monospace;margin-bottom:10px">${esc(index)}</div>

            <div style="font-size:10.5px;color:#6b7280;font-weight:800;text-transform:uppercase;margin-bottom:2px">Password</div>
            <div style="font-size:20px;font-weight:900;color:#10b981;font-family:monospace;letter-spacing:2px">${esc(pwd)}</div>
          </div>

          <button id="credOk" style="margin-top:18px;width:100%;padding:12px;background:#0891b2;color:white;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14px">ঠিক আছে</button>
        </div>
      `;
      document.body.appendChild(modal);
      document.getElementById('credOk').onclick = () => modal.remove();
    }

    /* ============ Print Single Card (fixed — no script tag) ============ */
    function printSingleCard(s) {
      const htmlContent = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>Login Info</title>
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
              font-family: 'Segoe UI', 'Noto Sans Bengali', Arial, sans-serif;
              padding: 32px 24px;
              text-align: center;
            }
            .header {
              border-bottom: 2px dashed #cbd5e1;
              padding-bottom: 14px;
              margin-bottom: 20px;
            }
            h1 { color: #0891b2; font-size: 20px; font-weight: 800; margin-bottom: 6px; }
            .sub { color: #6b7280; font-size: 13px; }
            .box {
              border: 3px dashed #0891b2;
              padding: 24px 20px;
              border-radius: 14px;
              margin: 20px 0;
              background: #ecfeff;
            }
            .lbl {
              font-size: 11px;
              color: #6b7280;
              text-transform: uppercase;
              font-weight: 800;
              letter-spacing: 0.5px;
              margin-bottom: 6px;
              margin-top: 14px;
            }
            .lbl:first-child { margin-top: 0; }
            .val {
              font-size: 18px;
              font-weight: 800;
              color: #1e1b4b;
              font-family: 'Courier New', monospace;
              word-break: break-all;
            }
            .val.index { font-size: 26px; color: #0891b2; letter-spacing: 1px; }
            .val.pwd   { font-size: 26px; color: #10b981; letter-spacing: 2px; }
            .steps {
              background: #eff6ff;
              border-left: 4px solid #2563eb;
              padding: 12px 16px;
              border-radius: 6px;
              text-align: left;
              font-size: 12.5px;
              color: #1e40af;
              margin-top: 16px;
              line-height: 1.8;
            }
            .steps b { color: #1e3a8a; }
            .footer {
              font-size: 12px;
              color: #6b7280;
              line-height: 1.7;
              margin-top: 20px;
            }
          </style>
        </head>
        <body>
          <div class="header">
            <h1>🎓 Student Login Information</h1>
            <p class="sub">${esc(school.name)}</p>
          </div>

          <div class="box">
            <div class="lbl">ছাত্রের নাম</div>
            <div class="val">${esc(s.name)}</div>

            <div class="lbl">Student Index</div>
            <div class="val index">${esc(s.student_index || '')}</div>

            <div class="lbl">Password</div>
            <div class="val pwd">${esc(s.login_password || FIXED_STUDENT_PASSWORD)}</div>
          </div>

          <div class="steps">
            <b>📱 Login করার নিয়ম:</b><br>
            1. Website খুলুন<br>
            2. <b>"ছাত্র লগইন"</b> tab-এ ক্লিক করুন<br>
            3. উপরের Index লিখুন<br>
            4. Password লিখুন<br>
            5. লগইন ক্লিক করুন
          </div>

          <div class="footer">
            ⚠️ এই কাগজটা নিরাপদে রাখুন।<br>

          </div>
        </body>
        </html>
      `;

      const w = window.open('', '', 'width=520,height=620');
      if (!w) {
        toast('❌ Popup ব্লকড। Popup allow করুন', 'error');
        return;
      }
      w.document.open();
      w.document.write(htmlContent);
      w.document.close();

      setTimeout(() => {
        try {
          w.focus();
          w.print();
        } catch (e) {
          console.error('Print error:', e);
        }
      }, 400);
    }

    document.getElementById('loadBtn').onclick = loadStudents;
    document.getElementById('printBtn').onclick = () => {
      if (!allStudents.length) {
        toast('আগে লোড করুন', 'error');
        return;
      }
      window.print();
    };
