<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ভর্তি · School</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root{
  --ad-primary:#7c3aed;
  --ad-primary-dark:#6d28d9;
  --ad-success:#10b981;
  --ad-rose:#f43f5e;
  --ad-amber:#f59e0b;
  --ad-blue:#3b82f6;
  --ad-bg:#f8fafc;
  --ad-border:#e2e8f0;
  --ad-text:#0f172a;
  --ad-gray:#64748b;
}
*{box-sizing:border-box}
.ad-page{padding:0;background:var(--ad-bg);min-height:100vh}

.ad-top{
  background:linear-gradient(135deg,#7c3aed 0%,#6d28d9 50%,#5b21b6 100%);
  padding:22px 28px;border-radius:12px 12px 0 0;color:#fff;
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:14px;position:relative;overflow:hidden;
}
.ad-top::before{
  content:'';position:absolute;top:-50%;right:-10%;
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);
  border-radius:50%;
}
.ad-top>*{position:relative;z-index:1}
.ad-top .tl{display:flex;align-items:center;gap:16px}
.ad-top .ticon{
  width:56px;height:56px;background:rgba(255,255,255,.2);
  border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:28px;border:1px solid rgba(255,255,255,.3);
}
.ad-top h1{margin:0;font-size:22px;font-weight:900}
.ad-top p{margin:4px 0 0;font-size:13px;opacity:.9}
.ad-tabs-top{display:flex;gap:6px;background:rgba(255,255,255,.15);padding:5px;border-radius:12px}
.ad-tabs-top button{
  padding:9px 18px;background:transparent;border:none;color:#fff;
  font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;
  border-radius:8px;transition:all .2s;
  display:inline-flex;align-items:center;gap:6px;
}
.ad-tabs-top button:hover:not(.on){background:rgba(255,255,255,.1)}
.ad-tabs-top button.on{background:#fff;color:var(--ad-primary-dark)}
.ad-back{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  color:#fff;padding:10px 18px;border-radius:10px;
  font-weight:700;font-size:13px;text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;
}
.ad-back:hover{background:rgba(255,255,255,.25)}

.ad-body{background:#fff;border-radius:0 0 12px 12px;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ad-split{display:grid;grid-template-columns:1fr 340px;gap:0}
.ad-left{padding:28px 32px;border-right:1px dashed #e2e8f0}
.ad-right{
  padding:28px 22px;
  background:linear-gradient(180deg,#fafbfc 0%,#f1f5f9 100%);
  display:flex;flex-direction:column;gap:16px;
}
.ad-right-title{
  font-size:13px;font-weight:800;color:var(--ad-gray);
  text-transform:uppercase;letter-spacing:.5px;
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
}
.ad-right-title::before{content:'';width:4px;height:16px;background:var(--ad-primary);border-radius:2px}

.ad-steps{display:flex;gap:6px;margin-bottom:26px;background:#f1f5f9;padding:6px;border-radius:14px}
.ad-step{
  flex:1;padding:12px 10px;text-align:center;border-radius:10px;cursor:pointer;
  font-size:12px;font-weight:800;color:var(--ad-gray);transition:all .2s;
  position:relative;border:2px solid transparent;
}
.ad-step .sn{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;
  background:#cbd5e1;color:#fff;font-size:12px;font-weight:800;margin-right:6px;
}
.ad-step.done .sn{background:var(--ad-success)}
.ad-step.done{color:var(--ad-success)}
.ad-step.current{background:#fff;color:var(--ad-primary);box-shadow:0 2px 8px rgba(124,58,237,.15);border-color:var(--ad-primary)}
.ad-step.current .sn{background:var(--ad-primary)}
.ad-step:not(.current):hover{background:#fff}

.ad-step-pane{display:none;animation:stepIn .35s ease}
.ad-step-pane.on{display:block}
@keyframes stepIn{from{opacity:0;transform:translateX(15px)}to{opacity:1;transform:translateX(0)}}

.step-head{margin-bottom:22px}
.step-head h2{font-size:20px;font-weight:900;color:var(--ad-text);margin:0 0 6px;letter-spacing:-.3px}
.step-head p{font-size:13px;color:var(--ad-gray);margin:0;line-height:1.6}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid.one{grid-template-columns:1fr}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{
  font-size:11.5px;color:var(--ad-gray);font-weight:800;
  text-transform:uppercase;letter-spacing:.4px;
}
.fld.req label::after{content:' *';color:var(--ad-rose)}
.fld input,.fld select,.fld textarea{
  padding:11px 14px;border:2px solid var(--ad-border);
  border-radius:10px;font-size:14px;font-family:inherit;
  font-weight:600;background:#fafbfc;color:var(--ad-text);
  transition:all .2s;width:100%;
}
.fld textarea{min-height:70px;resize:vertical;font-weight:500;line-height:1.6}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  outline:none;border-color:var(--ad-primary);
  background:#fff;box-shadow:0 0 0 4px rgba(124,58,237,.1);
}
.fld input.err{border-color:var(--ad-rose);background:#fef2f2}
.fld .hint{font-size:11px;color:#94a3b8;font-weight:500}

/* Auto index wrapper */
.idx-wrap{position:relative}
.idx-wrap input{
  padding-right:110px !important;
  font-family:'Courier New',monospace;
  font-weight:900 !important;
  font-size:16px !important;
  letter-spacing:1px;
  color:var(--ad-primary-dark) !important;
}
.idx-wrap .auto-badge{
  position:absolute;right:74px;top:50%;transform:translateY(-50%);
  background:linear-gradient(135deg,#10b981,#059669);
  color:#fff;font-size:10px;font-weight:900;
  padding:3px 8px;border-radius:6px;letter-spacing:.5px;
  pointer-events:none;
}
.idx-wrap .refresh-idx{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:#f3f4f6;border:1px solid var(--ad-border);
  width:34px;height:34px;border-radius:8px;cursor:pointer;
  font-size:14px;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.idx-wrap .refresh-idx:hover{background:#ede9fe;border-color:#c4b5fd}
.idx-wrap .refresh-idx:active{transform:translateY(-50%) scale(.93)}
.idx-wrap .refresh-idx.spinning{animation:spin .8s linear}
@keyframes spin{from{transform:translateY(-50%) rotate(0)}to{transform:translateY(-50%) rotate(360deg)}}

.photo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.pbox{
  text-align:center;padding:14px;background:#fafbfc;
  border:2px dashed var(--ad-border);border-radius:14px;
  transition:all .2s;cursor:pointer;position:relative;
}
.pbox:hover{border-color:var(--ad-primary);background:#f5f3ff}
.pbox.has{border-color:var(--ad-success);background:#f0fdf4;border-style:solid}
.pbox .pl{font-size:11.5px;font-weight:800;color:var(--ad-gray);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.pbox .preview{
  width:100%;height:180px;margin:0 auto 10px;background:#fff;
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:52px;color:#cbd5e1;overflow:hidden;border:1px solid var(--ad-border);
}
.pbox .preview img{width:100%;height:100%;object-fit:cover}
.pbox input[type=file]{display:none}
.pbox .pbtn{
  display:inline-block;padding:8px 14px;background:#fff;
  border:2px solid var(--ad-primary);color:var(--ad-primary);
  font-size:12px;font-weight:800;border-radius:8px;cursor:pointer;transition:all .15s;
}
.pbox.has .pbtn{background:var(--ad-success);border-color:var(--ad-success);color:#fff}
.pbox .pbtn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(124,58,237,.2)}

.nav-row{
  display:flex;gap:10px;justify-content:space-between;
  margin-top:26px;padding-top:20px;
  border-top:2px dashed var(--ad-border);flex-wrap:wrap;
}
.nav-btn{
  padding:13px 26px;border:none;border-radius:10px;
  font-weight:800;font-size:14px;cursor:pointer;
  font-family:inherit;display:inline-flex;align-items:center;
  gap:8px;transition:all .2s;
}
.nav-btn:disabled{opacity:.5;cursor:not-allowed}
.nav-btn-prev{background:#f1f5f9;color:var(--ad-gray)}
.nav-btn-prev:hover:not(:disabled){background:#e2e8f0}
.nav-btn-next{
  background:linear-gradient(135deg,var(--ad-primary),var(--ad-primary-dark));
  color:#fff;box-shadow:0 6px 16px rgba(124,58,237,.3);
}
.nav-btn-next:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 22px rgba(124,58,237,.4)}
.nav-btn-save{
  background:linear-gradient(135deg,var(--ad-success),#059669);
  color:#fff;box-shadow:0 6px 16px rgba(16,185,129,.3);
}
.nav-btn-save:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 22px rgba(16,185,129,.4)}

.preview-card{
  background:#fff;border-radius:16px;padding:20px;
  box-shadow:0 4px 14px rgba(15,23,42,.08);
  border:2px solid #e2e8f0;position:sticky;top:20px;transition:all .3s;
}
.preview-card:hover{box-shadow:0 8px 22px rgba(124,58,237,.15)}
.preview-card .pc-head{
  display:flex;align-items:center;gap:12px;
  padding-bottom:14px;margin-bottom:14px;
  border-bottom:2px dashed var(--ad-border);
}
.preview-card .pc-photo{
  width:64px;height:76px;border-radius:10px;
  background:linear-gradient(135deg,#ede9fe,#c4b5fd);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;color:#7c3aed;overflow:hidden;
  border:2px solid #a78bfa;flex-shrink:0;
}
.preview-card .pc-photo img{width:100%;height:100%;object-fit:cover}
.preview-card .pc-name{font-size:15px;font-weight:900;color:var(--ad-text);margin-bottom:3px;line-height:1.25;word-break:break-word}
.preview-card .pc-id{
  font-size:11.5px;font-family:'Courier New',monospace;
  color:var(--ad-primary);font-weight:800;
  background:#f5f3ff;padding:3px 8px;border-radius:6px;display:inline-block;
}
.preview-card .pc-row{
  display:flex;justify-content:space-between;gap:10px;
  padding:6px 0;font-size:12px;border-bottom:1px dotted #f1f5f9;
}
.preview-card .pc-row:last-child{border:none}
.preview-card .pc-lbl{color:var(--ad-gray);font-weight:700}
.preview-card .pc-val{color:var(--ad-text);font-weight:700;text-align:right;word-break:break-word}
.preview-card .pc-empty{color:#cbd5e1;font-style:italic}

.ad-alert{
  padding:12px 16px;border-radius:10px;font-size:13px;
  margin-bottom:16px;display:flex;gap:10px;line-height:1.55;align-items:flex-start;
}
.ad-alert.blue{background:#dbeafe;border-left:4px solid #2563eb;color:#1e40af}
.ad-alert.amber{background:#fef3c7;border-left:4px solid #f59e0b;color:#92400e}
.ad-alert.green{background:#d1fae5;border-left:4px solid #16a34a;color:#065f46}

.cr-bg{
  position:fixed;inset:0;background:rgba(15,23,42,.75);
  backdrop-filter:blur(6px);z-index:9999;
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .25s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.cr-m{
  background:#fff;border-radius:22px;padding:32px;
  max-width:440px;width:100%;text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.4);
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.cr-m .bi{font-size:68px;display:block;margin-bottom:8px}
.cr-m h3{color:var(--ad-success);font-size:24px;font-weight:900;margin:0 0 6px}
.cr-m .sb{color:var(--ad-gray);font-size:13.5px;margin:0 0 22px}
.cr-b{
  background:linear-gradient(135deg,#f5f3ff,#ede9fe);
  border-radius:16px;padding:22px;text-align:left;
  margin-bottom:18px;border:2px dashed var(--ad-primary);
}
.cr-b .lb{font-size:10.5px;color:var(--ad-gray);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.cr-b .vl{font-size:16px;font-weight:900;color:var(--ad-text);margin-bottom:14px;word-break:break-all}
.cr-b .vl.idx{font-size:24px;color:var(--ad-primary);font-family:'Courier New',monospace;letter-spacing:2px}
.cr-b .vl.pwd{font-size:24px;color:var(--ad-success);font-family:'Courier New',monospace;letter-spacing:2px;margin-bottom:0}
.cr-n{font-size:12px;color:#94a3b8;margin:0 0 20px;line-height:1.6}
.cr-a{display:flex;gap:10px}
.cr-a button{
  flex:1;padding:14px;border:none;border-radius:12px;
  font-weight:800;cursor:pointer;font-family:inherit;font-size:14px;transition:all .2s;
}
.cr-p{background:var(--ad-primary);color:#fff}
.cr-p:hover{background:var(--ad-primary-dark);transform:translateY(-1px)}
.cr-c{background:#f1f5f9;color:var(--ad-gray)}
.cr-c:hover{background:#e2e8f0}

.list-wrap{padding:24px 28px}
.list-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.lstat{
  background:linear-gradient(135deg,#fff,#fafbfc);
  border:1px solid var(--ad-border);border-radius:12px;
  padding:16px 18px;position:relative;overflow:hidden;
}
.lstat::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--ad-primary)}
.lstat.green::before{background:var(--ad-success)}
.lstat.rose::before{background:var(--ad-rose)}
.lstat.blue::before{background:var(--ad-blue)}
.lstat h4{font-size:10.5px;color:var(--ad-gray);text-transform:uppercase;font-weight:800;letter-spacing:.4px;margin:0 0 6px}
.lstat p{font-size:22px;font-weight:900;color:var(--ad-text);margin:0;line-height:1}
.lstat.green p{color:var(--ad-success)}
.lstat.rose p{color:var(--ad-rose)}
.lstat.blue p{color:var(--ad-blue)}

.list-search{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.list-search input,.list-search select{
  flex:1;min-width:180px;padding:11px 14px;
  border:2px solid var(--ad-border);border-radius:10px;
  font-size:14px;font-family:inherit;font-weight:600;background:#fff;
}
.list-search input:focus,.list-search select:focus{
  outline:none;border-color:var(--ad-primary);
  box-shadow:0 0 0 4px rgba(124,58,237,.1);
}

.stu-card{
  background:#fff;border:1px solid var(--ad-border);
  border-radius:14px;padding:16px 18px;margin-bottom:10px;
  display:flex;justify-content:space-between;gap:14px;
  align-items:center;transition:all .2s;
  border-left:4px solid var(--ad-primary);flex-wrap:wrap;
}
.stu-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.08)}
.stu-card .sc-i{flex:1;min-width:220px}
.stu-card .sc-n{font-size:15px;font-weight:800;color:var(--ad-text);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.stu-card .sc-id{
  font-size:11px;font-family:'Courier New',monospace;
  color:var(--ad-primary);background:#f5f3ff;
  padding:3px 8px;border-radius:6px;font-weight:800;
}
.stu-card .sc-m{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ad-gray)}
.stu-card .sc-m b{color:var(--ad-text);font-weight:700}
.stu-card .sc-acts{display:flex;gap:6px;flex-wrap:wrap}
.stu-card .sc-acts button{
  padding:8px 14px;border:none;border-radius:8px;
  font-size:12px;font-weight:800;cursor:pointer;
  font-family:inherit;transition:all .15s;
}
.a-info{background:#d1fae5;color:#065f46}
.a-info:hover{background:#a7f3d0}
.a-edit{background:#dbeafe;color:#1e40af}
.a-edit:hover{background:#bfdbfe}
.a-del{background:#fee2e2;color:#991b1b}
.a-del:hover{background:#fecaca}

.list-empty{text-align:center;padding:60px 20px;color:#94a3b8;font-weight:600;font-size:14px}
.list-empty .ic{font-size:64px;display:block;margin-bottom:14px;opacity:.4}

@media(max-width:1100px){
  .ad-split{grid-template-columns:1fr}
  .ad-left{border-right:none;border-bottom:1px dashed var(--ad-border)}
  .preview-card{position:static;max-width:400px;margin:0 auto}
}
@media(max-width:700px){
  .ad-left,.ad-right,.list-wrap{padding:18px}
  .fgrid{grid-template-columns:1fr}
  .photo-grid{grid-template-columns:1fr}
  .ad-steps{flex-direction:column;gap:4px}
  .ad-step{padding:10px 14px;text-align:left}
  .nav-btn{flex:1;justify-content:center;padding:12px 16px}
  .nav-row{flex-direction:column-reverse}
  .ad-top{padding:16px 18px}
  .ad-top h1{font-size:17px}
  .ad-top .ticon{width:46px;height:46px;font-size:22px}
}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { supabase } from './js/supabase.js';
import { requireLogin, renderLayout, esc, toast, logAction } from './js/helpers.js';

const profile = await requireLogin(['admin']);
if (!profile) throw new Error('no auth');
renderLayout(profile, 'admission.html', 'ভর্তি ব্যবস্থাপনা');

const content = document.getElementById('content');
let allClasses = [];
let allStudents = [];
let editingId = null;
let currentStep = 1;
const TOTAL_STEPS = 4;
const FIXED_PASSWORD = 'knsstudent';
const SERIAL_DIGITS = 3; /* 001, 002, ... */

let photoStudent = '';
let photoFather = '';
let photoMother = '';
let originalPhotos = { student:'', father:'', mother:'' };

content.innerHTML = `
<div class="ad-page">

  <div class="ad-top">
    <div class="tl">
      <div class="ticon">🎓</div>
      <div>
        <h1>Student Admission</h1>
        <p>ছাত্র ভর্তি ব্যবস্থাপনা</p>
      </div>
    </div>
    <div class="ad-tabs-top">
      <button class="on" id="tabNew">➕ নতুন ভর্তি</button>
      <button id="tabList">📋 ছাত্র তালিকা</button>
    </div>
    <a class="ad-back" href="dashboard.html">← Back</a>
  </div>

  <div class="ad-body">
    <div id="paneNew">
      <div class="ad-split">

        <div class="ad-left">
          <div class="ad-alert blue">
            <span>💡</span>
            <span><b>Student Index</b> স্বয়ংক্রিয়ভাবে তৈরি হবে — <b>সেশন + সিরিয়াল</b> (যেমন: 2026001)।</span>
          </div>

          <div class="ad-steps" id="stepsBar">
            <div class="ad-step current" data-step="1"><span class="sn">1</span>ছবি</div>
            <div class="ad-step" data-step="2"><span class="sn">2</span>ছাত্র তথ্য</div>
            <div class="ad-step" data-step="3"><span class="sn">3</span>পিতা-মাতা</div>
            <div class="ad-step" data-step="4"><span class="sn">4</span>ঠিকানা</div>
          </div>

          <div class="ad-step-pane on" data-pane="1">
            <div class="step-head">
              <h2>📷 ছবি আপলোড</h2>
              <p>তিনজনের ছবি দিতে পারেন (ঐচ্ছিক)।</p>
            </div>
            <div class="photo-grid">
              <div class="pbox" id="boxStudent">
                <div class="pl">ছাত্রের ছবি</div>
                <div class="preview" id="prevStudent">👤</div>
                <div class="pbtn">ছবি বাছুন</div>
                <input type="file" id="fileStudent" accept="image/*">
              </div>
              <div class="pbox" id="boxFather">
                <div class="pl">বাবার ছবি</div>
                <div class="preview" id="prevFather">👨</div>
                <div class="pbtn">ছবি বাছুন</div>
                <input type="file" id="fileFather" accept="image/*">
              </div>
              <div class="pbox" id="boxMother">
                <div class="pl">মায়ের ছবি</div>
                <div class="preview" id="prevMother">👩</div>
                <div class="pbtn">ছবি বাছুন</div>
                <input type="file" id="fileMother" accept="image/*">
              </div>
            </div>
          </div>

          <div class="ad-step-pane" data-pane="2">

/* ============================================================
   🎯 AUTO-GENERATE STUDENT INDEX
   Format: সেশন(4) + সিরিয়াল(3) = 2026001, 2026002...
   ============================================================ */
async function generateNextIndex(sessionYear) {
  const year = sessionYear || new Date().getFullYear();
  const prefix = String(year);

  try {
    /* Fetch all student_index starting with prefix */
    const { data, error } = await supabase
      .from('students')
      .select('student_index')
      .like('student_index', prefix + '%');

    if (error) {
      console.warn('Index fetch error:', error);
      return prefix + String(1).padStart(SERIAL_DIGITS, '0');
    }

    /* Find highest numeric value */
    let maxSerial = 0;
    (data || []).forEach(s => {
      if (!s.student_index) return;
      const str = String(s.student_index);
      /* Take last SERIAL_DIGITS chars as serial */
      if (str.length >= prefix.length + SERIAL_DIGITS) {
        const serialPart = str.slice(prefix.length);
        const n = parseInt(serialPart, 10);
        if (!isNaN(n) && n > maxSerial) maxSerial = n;
      }
    });

    const nextSerial = maxSerial + 1;
    return prefix + String(nextSerial).padStart(SERIAL_DIGITS, '0');

  } catch (err) {
    console.error('Generate index error:', err);
    return prefix + String(1).padStart(SERIAL_DIGITS, '0');
  }
}

/* ============ STEP NAVIGATION ============ */
function goToStep(n) {
  if (n < 1 || n > TOTAL_STEPS) return;
  currentStep = n;
  document.querySelectorAll('.ad-step-pane').forEach(p => {
    p.classList.toggle('on', parseInt(p.dataset.pane) === n);
  });
  document.querySelectorAll('.ad-step').forEach(s => {
    const sn = parseInt(s.dataset.step);
    s.classList.remove('current','done');
    if (sn === n) s.classList.add('current');
    else if (sn < n) s.classList.add('done');
  });
  document.getElementById('btnPrev').disabled = (n === 1);
  document.getElementById('btnNext').style.display = (n === TOTAL_STEPS) ? 'none' : 'inline-flex';
  document.getElementById('btnSave').style.display = (n === TOTAL_STEPS) ? 'inline-flex' : 'none';
  document.querySelector('.ad-left').scrollIntoView({top:0,behavior:'smooth'});
}

};

/* ============ PHOTO COMPRESS ============ */
function compressImage(file, maxSize) {
  maxSize = maxSize || 800;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          if (w > h) { h = h * maxSize / w; w = maxSize; }
          else { w = w * maxSize / h; h = maxSize; }
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function bindPhoto(inputId, boxId, previewId, setter) {
  document.getElementById(inputId).onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      toast('❌ ছবি ৫ MB এর কম হতে হবে', 'error');
      e.target.value = '';
      return;
    }
    try {
      const b64 = await compressImage(file);
      document.getElementById(previewId).innerHTML = '<img src="' + b64 + '">';
      document.getElementById(boxId).classList.add('has');
      setter(b64);
      updatePreview();
      toast('✅ ছবি লোড হয়েছে', 'success');
    } catch (err) {
      toast('❌ ছবি লোড হয়নি', 'error');
    }
  };
  document.getElementById(boxId).onclick = (e) => {
    if (e.target.tagName !== 'INPUT') document.getElementById(inputId).click();
  };
}

    birth_certificate_no: birth || null,
    email: email || null,
    father_name: fatherName || null,
    father_occupation: fatherOcc || null,
    father_mobile: fatherMob || null,
    father_nid: fatherNid || null,
    mother_name: motherName || null,
    mother_occupation: motherOcc || null,
    mother_mobile: motherMob || null,
    mother_nid: motherNid || null,
    guardian_name: guardian || fatherName || null,
    guardian_phone: gphone || fatherMob || null,
    present_address: present || null,
    permanent_address: permanent || null,
    student_photo: photoStudent || originalPhotos.student || null,
    father_photo: photoFather || originalPhotos.father || null,
    mother_photo: photoMother || originalPhotos.mother || null,
    login_email: loginEmail,
    login_password: loginPassword,
    login_enabled: true
  };

  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = '⏳ সেভ হচ্ছে...';

  try {
    let result;
    if (editingId) {
      result = await supabase.from('students').update(payload).eq('id', editingId).select().single();
      if (result.error) throw result.error;
      await logAction('update','students',editingId,'Update: ' + name);
      toast('✅ আপডেট হয়েছে', 'success');
    } else {
      result = await supabase.from('students').insert(payload).select().single();
      if (result.error) throw result.error;
      await logAction('create','students',result.data.id,'New: ' + name);
      toast('✅ ভর্তি সম্পন্ন', 'success');
      showCredentials(name, index, loginPassword);
    }
    resetForm();
    document.getElementById('tabList').click();
  } catch (err) {
    console.error('Save error:', err);
    let m = err.message || 'সেভ হয়নি';
    if (m.toLowerCase().indexOf('duplicate') >= 0 || m.toLowerCase().indexOf('unique') >= 0) {
      m = 'এই Student Index আগেই ব্যবহার হয়েছে';
    }
    toast('❌ ' + m, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = editingId ? '💾 আপডেট করুন' : '💾 ছাত্র ভর্তি করুন';
  }
};

/* ============ RESET ============ */
async function resetForm() {
  editingId = null;
  photoStudent = ''; photoFather = ''; photoMother = '';
  originalPhotos = { student:'', father:'', mother:'' };

  ['f_name','f_roll','f_dob','f_birth','f_email',
   'f_father','f_foccupation','f_fmobile','f_fnid',
   'f_mother','f_moccupation','f_mmobile','f_mnid',
   'f_guardian','f_gphone','f_present','f_permanent'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });

  ['f_class','f_section','f_group','f_blood','f_gender'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });

  document.getElementById('f_type').value = 'active';
  document.getElementById('f_section').innerHTML = '<option value="">-- --</option>';

  document.getElementById('prevStudent').innerHTML = '👤';
  document.getElementById('prevFather').innerHTML = '👨';
  document.getElementById('prevMother').innerHTML = '👩';
  document.getElementById('boxStudent').classList.remove('has');
  document.getElementById('boxFather').classList.remove('has');
  document.getElementById('boxMother').classList.remove('has');
  document.getElementById('fileStudent').value = '';
  document.getElementById('fileFather').value = '';
  document.getElementById('fileMother').value = '';

  document.getElementById('btnSave').textContent = '💾 ছাত্র ভর্তি করুন';

  /* Reset session and regenerate index */
  const y = new Date().getFullYear();
  document.getElementById('f_session').value = y;
  const newIdx = await generateNextIndex(y);
  document.getElementById('f_index').value = newIdx;

  updatePreview();
  goToStep(1);
}

document.getElementById('btnReset').onclick = async () => {
  if (editingId && !confirm('পরিবর্তন বাতিল করবেন?')) return;
  await resetForm();
  toast('🆕 নতুন ফর্ম', 'success');
};

/* ============ CREDENTIALS POPUP ============ */
function showCredentials(name, index, password) {
  const div = document.createElement('div');
  div.className = 'cr-bg';

  let html = '';
  html += '<div class="cr-m">';
  html += '<span class="bi">🎉</span>';
  html += '<h3>ভর্তি সম্পন্ন!</h3>';
  html += '<p class="sb">ছাত্রকে এই তথ্য লিখে দিন</p>';
  html += '<div class="cr-b">';
  html += '<div class="lb">নাম</div><div class="vl">' + esc(name) + '</div>';
  html += '<div class="lb">Student Index</div><div class="vl idx">' + esc(index) + '</div>';
  html += '<div class="lb">Password</div><div class="vl pwd">' + esc(password) + '</div>';
  html += '</div>';
  html += '<p class="cr-n">Website-এ "🎓 ছাত্র লগইন" tab-এ এই Index আর Password দিয়ে login করবেন।</p>';
  html += '<div class="cr-a">';

  html += '<button class="cr-c" id="crClose">ঠিক আছে</button>';
  html += '</div>';
  html += '</div>';

  div.innerHTML = html;
  document.body.appendChild(div);

  document.getElementById('crClose').onclick = () => div.remove();
  document.getElementById('crPrint').onclick = () => printCard(name, index, password);
}

  html += '<div style="font-size:20px;font-weight:800;color:#1e1b4b;font-family:monospace;margin-bottom:16px">' + esc(name) + '</div>';
  html += '<div style="font-size:11px;color:#6b7280;font-weight:800;text-transform:uppercase;margin-bottom:6px">Student Index</div>';
  html += '<div style="font-size:28px;font-weight:800;color:#7c3aed;font-family:monospace;letter-spacing:2px;margin-bottom:16px">' + esc(index) + '</div>';
  html += '<div style="font-size:11px;color:#6b7280;font-weight:800;text-transform:uppercase;margin-bottom:6px">Password</div>';

  html += '৩. উপরের Index লিখুন<br>৪. Password লিখুন<br>৫. লগইন ক্লিক করুন';
  html += '</div>';

  pa.style.display = 'block';
  setTimeout(() => {
    window.print();

}

/* ============ LOAD STUDENTS ============ */
async function loadStudents() {
  const area = document.getElementById('listArea');
  area.innerHTML = '<div class="list-empty"><span class="ic">⏳</span>লোড হচ্ছে...</div>';

  try {
    const { data, error } = await supabase.from('students').select('*')
      .or('is_deleted.is.null,is_deleted.eq.false')
      .order('id',{ascending:false}).limit(500);
    if (error) throw error;
    allStudents = data || [];
    renderStats();
    renderList();
  } catch (err) {
    area.innerHTML = '<div class="list-empty"><span class="ic">❌</span>' + esc(err.message) + '</div>';
  }
}

function renderStats() {
  const total = allStudents.length;
  const active = allStudents.filter(s => s.student_type !== 'inactive').length;
  const inactive = total - active;
  const classesCount = new Set(allStudents.map(s => s.class_id).filter(Boolean)).size;
  document.getElementById('listStats').innerHTML =
    '<div class="lstat"><h4>মোট ছাত্র</h4><p>' + total + '</p></div>' +
    '<div class="lstat green"><h4>Active</h4><p>' + active + '</p></div>' +
    '<div class="lstat rose"><h4>Inactive</h4><p>' + inactive + '</p></div>' +
    '<div class="lstat blue"><h4>ক্লাস</h4><p>' + classesCount + '</p></div>';
}

function renderList() {
  const area = document.getElementById('listArea');
  const q = (document.getElementById('searchBox').value || '').trim().toLowerCase();
  const classF = document.getElementById('filterClass').value;
  const typeF = document.getElementById('filterType').value;

  let list = allStudents;
  if (q) {
    list = list.filter(s =>
      (s.name || '').toLowerCase().includes(q) ||
      (s.student_index || '').toLowerCase().includes(q) ||
      (s.guardian_phone || '').includes(q) ||
      (s.father_name || '').toLowerCase().includes(q)
    );
  }
  if (classF) list = list.filter(s => String(s.class_id) === classF);
  if (typeF) list = list.filter(s => (s.student_type || 'active') === typeF);

  if (!list.length) {
    area.innerHTML = '<div class="list-empty"><span class="ic">🔍</span>কোনো ছাত্র পাওয়া যায়নি</div>';
    return;
  }

  let html = '';
  list.forEach(s => {
    const cls = allClasses.find(c => c.id == s.class_id);
    const clsName = cls ? cls.class_name : '-';

    html += '<div class="stu-card">';
    html += '<div class="sc-i">';
    html += '<div class="sc-n">' + esc(s.name) + ' <span class="sc-id">' + esc(s.student_index || '-') + '</span></div>';
    html += '<div class="sc-m">';
    html += '<span>ক্লাস: <b>' + esc(clsName) + '</b></span>';
    if (s.section) html += '<span>সেকশন: <b>' + esc(s.section) + '</b></span>';
    if (s.roll) html += '<span>রোল: <b>' + esc(s.roll) + '</b></span>';
    if (s.father_name) html += '<span>পিতা: <b>' + esc(s.father_name) + '</b></span>';
    if (s.guardian_phone) html += '<span>📞 <b>' + esc(s.guardian_phone) + '</b></span>';
    html += '</div>';
    html += '</div>';
    html += '<div class="sc-acts">';
    html += '<button class="a-info" data-act="info" data-id="' + s.id + '">🔑 Login Info</button>';
    html += '<button class="a-edit" data-act="edit" data-id="' + s.id + '">✏️ এডিট</button>';
    html += '<button class="a-del" data-act="del" data-id="' + s.id + '">🗑️</button>';
    html += '</div>';
    html += '</div>';
  });
  area.innerHTML = html;

  area.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id;
      const act = b.dataset.act;
      const s = allStudents.find(x => String(x.id) === String(id));
      if (!s) return;
      if (act === 'info') showCredentials(s.name, s.student_index || '-', s.login_password || FIXED_PASSWORD);
      else if (act === 'edit') editStudent(s);
      else if (act === 'del') deleteStudent(s);
    };
  });
}

document.getElementById('searchBox').oninput = renderList;
document.getElementById('filterClass').onchange = renderList;
document.getElementById('filterType').onchange = renderList;

/* ============ EDIT ============ */
function editStudent(s) {
  document.getElementById('tabNew').click();
  editingId = s.id;

  document.getElementById('f_index').value = s.student_index || '';
  document.getElementById('f_name').value = s.name || '';
  document.getElementById('f_class').value = s.class_id || '';
  document.getElementById('f_class').dispatchEvent(new Event('change'));

  setTimeout(() => {
    document.getElementById('f_section').value = s.section || '';
    updatePreview();
  }, 50);

  document.getElementById('f_roll').value = s.roll || '';
  document.getElementById('f_group').value = s.group_name || '';
  document.getElementById('f_session').value = s.session_year || '';
  document.getElementById('f_type').value = s.student_type || 'active';
  document.getElementById('f_dob').value = s.date_of_birth || '';
  document.getElementById('f_blood').value = s.blood_group || '';
  document.getElementById('f_gender').value = s.gender || '';
  document.getElementById('f_birth').value = s.birth_certificate_no || '';
  document.getElementById('f_email').value = s.email || '';
  document.getElementById('f_father').value = s.father_name || '';
  document.getElementById('f_foccupation').value = s.father_occupation || '';
  document.getElementById('f_fmobile').value = s.father_mobile || '';
  document.getElementById('f_fnid').value = s.father_nid || '';
  document.getElementById('f_mother').value = s.mother_name || '';
  document.getElementById('f_moccupation').value = s.mother_occupation || '';
  document.getElementById('f_mmobile').value = s.mother_mobile || '';
  document.getElementById('f_mnid').value = s.mother_nid || '';
  document.getElementById('f_guardian').value = s.guardian_name || '';
  document.getElementById('f_gphone').value = s.guardian_phone || '';
  document.getElementById('f_present').value = s.present_address || '';
  document.getElementById('f_permanent').value = s.permanent_address || '';

  originalPhotos = {
    student: s.student_photo || '',
    father: s.father_photo || '',
    mother: s.mother_photo || '',
  };
  photoStudent = ''; photoFather = ''; photoMother = '';

  if (s.student_photo) {
    document.getElementById('prevStudent').innerHTML = '<img src="' + s.student_photo + '">';
    document.getElementById('boxStudent').classList.add('has');
  }
  if (s.father_photo) {
    document.getElementById('prevFather').innerHTML = '<img src="' + s.father_photo + '">';
    document.getElementById('boxFather').classList.add('has');
  }
  if (s.mother_photo) {
    document.getElementById('prevMother').innerHTML = '<img src="' + s.mother_photo + '">';
    document.getElementById('boxMother').classList.add('has');
  }

  document.getElementById('btnSave').textContent = '💾 আপডেট করুন';
  updatePreview();
  goToStep(1);
  toast('✏️ এডিট মোড', 'success');
}

/* ============ DELETE ============ */
async function deleteStudent(s) {
  if (!confirm('"' + s.name + '" কে Recycle Bin-এ পাঠাবেন?')) return;
  try {
    const { error } = await supabase.from('students')
      .update({ is_deleted: true, deleted_at: new Date().toISOString() })
      .eq('id', s.id);
    if (error) throw error;
    await logAction('delete','students',s.id,'Delete: ' + s.name);
    toast('🗑️ মুছে ফেলা হয়েছে', 'success');
    loadStudents();
  } catch (err) {
    toast('❌ ' + err.message, 'error');
  }
}

/* ============ INIT ============ */
goToStep(1);
</script>
